name: Knowledge governance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  knowledge-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python packages/knowledge_governance/validate.py
      - run: python -m unittest discover -s scripts/tests -p test_knowledge_governance.py -v
