name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run test:apos
      - run: npm run demo:apos
