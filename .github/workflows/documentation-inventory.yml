name: Documentation inventory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_document_inventory.py
      - run: python scripts/verify_document_metadata.py
      - run: python scripts/verify_reading_routes.py
      - run: python -m unittest discover -s scripts/tests -p test_reading_routes.py
